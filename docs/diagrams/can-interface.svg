<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <style>
      .title{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#172c35}.sub{font-family:Arial,sans-serif;font-size:20px;fill:#52676e}.head{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#1e343c}.text{font-family:Arial,sans-serif;font-size:17px;fill:#40565e}.small{font-family:Arial,sans-serif;font-size:15px;fill:#5f7278}.tag{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#236d68}.wire{fill:none;stroke:#147c78;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.planned{fill:none;stroke:#53758d;stroke-width:3;stroke-dasharray:10 8;stroke-linecap:round}.box{fill:#fff;stroke:#9db8b3;stroke-width:2}.arrow{fill:#147c78}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#f7f8f5"/>
  <rect width="1800" height="12" fill="#147c78"/>
  <text class="title" x="80" y="88">CAN Interface</text>
  <text class="sub" x="82" y="126">Schematic-verified differential bus, transceiver, termination, and protection</text>
  <rect x="1460" y="55" width="260" height="42" rx="4" fill="#e4f1ed"/>
  <circle cx="1482" cy="76" r="5" fill="#147c78"/>
  <text class="tag" x="1500" y="81">CURRENT HARDWARE</text>
  <path d="M80 160H1720" stroke="#d8dfdb" stroke-width="2"/>

  <rect class="box" x="80" y="280" width="250" height="230" rx="8"/>
  <text class="head" x="108" y="327">ArduPilot FC</text>
  <text class="text" x="108" y="360">CAN / DroneCAN bus</text>
  <circle cx="108" cy="410" r="7" fill="#147c78"/>
  <text class="head" x="130" y="416">CAN_H</text>
  <circle cx="108" cy="466" r="7" fill="#147c78"/>
  <text class="head" x="130" y="472">CAN_L</text>

  <rect class="box" x="390" y="280" width="300" height="230" rx="8"/>
  <text class="head" x="418" y="327">J3 · CAN Connector</text>
  <text class="text" x="418" y="371">Pin 1  VBUS</text>
  <text class="text" x="418" y="411">Pin 2  CANH</text>
  <text class="text" x="418" y="451">Pin 3  CANL</text>
  <text class="text" x="418" y="491">Pin 4  GND</text>

  <path class="wire" d="M330 410H390M330 466H390M690 410H1130M690 466H1130"/>
  <path class="arrow" d="M1118 402L1130 410L1118 418Z"/>
  <path class="arrow" d="M1118 458L1130 466L1118 474Z"/>
  <text class="head" x="725" y="393">CAN_H</text>
  <text class="head" x="725" y="495">CAN_L</text>

  <path class="wire" d="M895 410V426M895 450V466"/>
  <path d="M895 426l-14 5 28 8-28 8 28 8-14 5" fill="none" stroke="#147c78" stroke-width="3"/>
  <text class="small" x="925" y="438">R16 · 120 Ω</text>
  <text class="small" x="925" y="459">across CANH / CANL</text>

  <path class="wire" d="M1000 410V510M1090 466V510"/>
  <rect x="980" y="510" width="130" height="58" rx="3" fill="#e4f1ed" stroke="#147c78" stroke-width="2"/>
  <text x="1045" y="534" text-anchor="middle" class="small">D3</text>
  <text x="1045" y="555" text-anchor="middle" class="small">NUP2105L</text>
  <path class="wire" d="M1045 568V582"/>
  <path d="M1029 582H1061M1034 590H1056M1040 598H1050" stroke="#147c78" stroke-width="3"/>

  <rect class="box" x="1130" y="280" width="255" height="230" rx="8"/>
  <text class="head" x="1157" y="327">U3 · TCAN332</text>
  <text class="text" x="1157" y="366">CAN transceiver</text>
  <text class="text" x="1157" y="416">CANH input</text>
  <text class="text" x="1157" y="472">CANL input</text>
  <text class="small" x="1157" y="496">3.3 V supply</text>

  <path class="wire" d="M1385 374H1490V410H1530"/>
  <path class="wire" d="M1385 438H1490V466H1530"/>
  <path class="arrow" d="M1518 402L1530 410L1518 418Z"/>
  <path class="arrow" d="M1518 458L1530 466L1518 474Z"/>
  <text class="small" x="1415" y="357">TXD / RXD</text>
  <rect class="box" x="1530" y="360" width="220" height="155" rx="8"/>
  <text class="head" x="1555" y="410">U1 · ESP32-C6FH4</text>
  <text class="text" x="1555" y="445">GPIO14 · TXD</text>
  <text class="text" x="1555" y="479">GPIO15 · RXD</text>

  <path d="M80 615H1720" stroke="#d8dfdb" stroke-width="2"/>
  <rect x="80" y="640" width="1640" height="108" rx="6" fill="#fff7e8" stroke="#e0c98f" stroke-width="2"/>
  <text x="110" y="680" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725319">POWER NOTE</text>
  <text class="text" x="110" y="714">J3 pin 1 VBUS shares the board VBUS net with USB-C and the 3.3 V regulator input. Check the system power scheme before connecting independent supplies.</text>

  <rect x="80" y="770" width="790" height="178" rx="6" fill="#edf4f1" stroke="#bfd3cd" stroke-width="2"/>
  <text class="head" x="108" y="813">Schematic facts</text>
  <text class="text" x="108" y="852">D3 NUP2105L clamps CANH / CANL to GND.</text>
  <text class="text" x="108" y="884">R16 120 Ω bridges CANH and CANL on this board.</text>
  <text class="text" x="108" y="916">No project CAN data rate has been validated.</text>
  <rect x="900" y="770" width="820" height="178" rx="6" fill="#eef2f5" stroke="#c6d3dc" stroke-width="2"/>
  <text class="head" x="928" y="813">Signal names in the design</text>
  <text class="text" x="928" y="852">Schematic net names are CANH and CANL.</text>
  <text class="text" x="928" y="884">CAN_H / CAN_L are used here for readability.</text>
  <text class="text" x="928" y="916">TCAN332 symbol capability: 1 Mbps; untested here.</text>
</svg>
